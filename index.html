<script>
let currentPage = 1;
const itemsPerPage = 10;
let items = [];
let filteredItems = [];

async function cargarFeed() {
  // Trae hasta 500 artículos del feed de Blogger
  const feedUrl = "https://api.rss2json.com/v1/api.json?rss_url=https://elelefanteeconomico.blogspot.com/feeds/posts/default?max-results=500";
  
  const response = await fetch(feedUrl);
  const data = await response.json();

  // rss2json devuelve los artículos en data.items
  items = data.items;
  filteredItems = items;

  mostrarPagina(currentPage);
}

function mostrarPagina(page) {
  const start = (page - 1) * itemsPerPage;
  const end = start + itemsPerPage;
  const pageItems = filteredItems.slice(start, end);

  let html = "<ul>";

  for (let item of pageItems) {
    const title = item.title;
    const link = item.link;
    const summary = item.description;
    const fecha = new Date(item.pubDate).toLocaleDateString("es-ES", {
      year: "numeric",
      month: "long",
      day: "numeric"
    });

    const resumenCorto = summary.length > 250 ? summary.substring(0, 250) + "…" : summary;
    const thumbnail = item.thumbnail || "https://via.placeholder.com/140?text=Sin+imagen";

    html += `
      <li class="article-card fade-in">
        <img src="${thumbnail}" alt="Miniatura">
        <div>
          <a href="${link}" target="_blank">${title}</a>
          <p><strong>${fecha}</strong></p>
          <p>${resumenCorto}</p>
        </div>
      </li>
    `;
  }

  html += "</ul>";
  document.getElementById("feed").innerHTML = html;

  activarAnimaciones();
}

function activarAnimaciones() {
  const elementos = document.querySelectorAll('.fade-in');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  });
  elementos.forEach(el => observer.observe(el));
}

document.getElementById("prevBtn").onclick = () => {
  if (currentPage > 1) {
    currentPage--;
    mostrarPagina(currentPage);
  }
};

document.getElementById("nextBtn").onclick = () => {
  if (currentPage * itemsPerPage < filteredItems.length) {
    currentPage++;
    mostrarPagina(currentPage);
  }
};

document.getElementById("searchInput").oninput = (e) => {
  const q = e.target.value.toLowerCase();
  filteredItems = items.filter(item =>
    item.title.toLowerCase().includes(q) ||
    item.description.toLowerCase().includes(q)
  );
  currentPage = 1;
  mostrarPagina(currentPage);
};

window.onscroll = () => {
  document.getElementById("topBtn").style.display = window.scrollY > 300 ? "block" : "none";
};

document.getElementById("topBtn").onclick = () => {
  window.scrollTo({ top: 0, behavior: "smooth" });
};

document.getElementById("darkModeBtn").onclick = () => {
  document.body.classList.toggle("dark-mode");
};

cargarFeed();
</script>
